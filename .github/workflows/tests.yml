name: Testy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-test:
    name: swift test a sestavení (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Testy
        run: swift test

      - name: Sestavení aplikace (ad-hoc)
        env:
          OUT_DIR: ${{ runner.temp }}/app
        run: zsh scripts/build-app.sh
